name: Build and Push OptScale Images

on:
  push:
    branches:
      - integration  # Triggers pipeline when code is pushed to main
  workflow_dispatch: # Adds a button to trigger it manually from the GitHub UI

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches tags, which OptScale build scripts sometimes require

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Retag and Push All Images
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          # 1. Force the Docker username to lowercase (Docker Hub requirement)
          HUB_USER=$(echo "$DOCKER_USERNAME" | tr '[:upper:]' '[:lower:]')
          echo "Processing push for Docker Hub account: $HUB_USER"
          
          # 2. Tag and push ALL locally built OptScale images
          docker images --format "{{.Repository}}:{{.Tag}}" | grep -v "<none>" | while read -r IMAGE; do
              # Extract image repository name without any 'hystax/' or registry prefix
              RAW_NAME=$(echo "$IMAGE" | awk -F':' '{print $1}' | awk -F'/' '{print $NF}')
              TAG=$(echo "$IMAGE" | awk -F':' '{print $2}')
              
              # Skip pushing official docker system images if any exist
              if [[ "$RAW_NAME" != "ubuntu" && "$RAW_NAME" != "alpine" ]]; then
                  NEW_TAG="$HUB_USER/$RAW_NAME:$TAG"
                  echo "----------------------------------------"
                  echo "Tagging $IMAGE -> $NEW_TAG"
                  docker tag "$IMAGE" "$NEW_TAG"
                  
                  echo "Pushing $NEW_TAG..."
                  docker push "$NEW_TAG"
              fi
          done
          
          # 3. Explicitly pull and push required 3rd-party database images for Kubernetes
          THIRD_PARTY_IMAGES=(
              "clickhouse/clickhouse-server:24.12"
              "curlimages/curl:latest"
              "gcr.io/etcd-development/etcd:v3.2.13"
              "rabbitmq:4.1.4-management-alpine"
              "thanosio/thanos:v0.39.1"
              "nginx:1.27-alpine"
          )
          
          for IMAGE in "${THIRD_PARTY_IMAGES[@]}"; do
              echo "----------------------------------------"
              echo "Pulling base image: $IMAGE"
              docker pull "$IMAGE"
              
              RAW_NAME=$(echo "$IMAGE" | awk -F':' '{print $1}' | awk -F'/' '{print $NF}')
              TAG=$(echo "$IMAGE" | awk -F':' '{print $2}')
              
              NEW_TAG="$HUB_USER/$RAW_NAME:$TAG"
              echo "Pushing 3rd-party image -> $NEW_TAG"
              docker tag "$IMAGE" "$NEW_TAG"
              docker push "$NEW_TAG"
          done
