name: Build and Push OptScale Images

on:
  push:
    branches:
      - integration  # Triggers pipeline when code is pushed to main
  workflow_dispatch: # Adds a button to trigger it manually from the GitHub UI

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches tags, which OptScale build scripts sometimes require

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Retag and Push Images
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          HUB_USER=$(echo "$DOCKER_USERNAME" | tr '[:upper:]' '[:lower:]')
          echo "Using Docker Hub Account: $HUB_USER"
          
          # List all locally available images to the GitHub logs for debugging
          echo "=== ALL LOCAL IMAGES ==="
          docker images
          echo "========================"
          
          # 1. PUSH ALL IMAGES (Aggressive Match)
          # Instead of looking for "hystax", we process EVERY image built locally
          # EXCEPT the base operating system and build tools.
          docker images --format '{{.Repository}}:{{.Tag}}' | grep -v '<none>' | while read -r IMAGE; do
              
              # Skip standard base images that shouldn't be pushed
              if [[ "$IMAGE" == *"ubuntu"* ]] || [[ "$IMAGE" == *"alpine"* ]] || [[ "$IMAGE" == *"golang"* ]] || [[ "$IMAGE" == *"python"* ]] || [[ "$IMAGE" == *"node"* ]]; then
                  continue
              fi
              
              # Extract the app name and tag, stripping any directory or registry prefixes
              # Example: localhost/hystax/auth:latest -> auth:latest
              APP_NAME=${IMAGE##*/}
              
              NEW_TAG="$HUB_USER/$APP_NAME"
              
              echo "----------------------------------------"
              echo "Found Image: $IMAGE"
              echo "Tagging as:  $NEW_TAG"
              docker tag "$IMAGE" "$NEW_TAG"
              
              echo "Pushing: $NEW_TAG"
              docker push "$NEW_TAG"
          done
          
          # 2. PUSH THIRD-PARTY IMAGES
          THIRD_PARTY_IMAGES=(
              "clickhouse/clickhouse-server:24.12"
              "curlimages/curl:latest"
              "gcr.io/etcd-development/etcd:v3.2.13"
              "rabbitmq:4.1.4-management-alpine"
              "thanosio/thanos:v0.39.1"
              "nginx:1.27-alpine"
          )
          
          for BASE_IMAGE in "${THIRD_PARTY_IMAGES[@]}"; do
              echo "--------------------------------"
              echo "Pulling: $BASE_IMAGE"
              docker pull "$BASE_IMAGE"
              
              SHORT_NAME=$(echo "$BASE_IMAGE" | awk -F'/' '{print $NF}')
              NEW_TAG="$HUB_USER/$SHORT_NAME"
              
              echo "Tagging: $BASE_IMAGE -> $NEW_TAG"
              docker tag "$BASE_IMAGE" "$NEW_TAG"
              
              echo "Pushing: $NEW_TAG"
              docker push "$NEW_TAG"
          done
