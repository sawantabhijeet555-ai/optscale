name: Build and Push OptScale Images

on:
  push:
    branches:
      - integration  # Triggers pipeline when code is pushed to main
  workflow_dispatch: # Adds a button to trigger it manually from the GitHub UI

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches tags, which OptScale build scripts sometimes require

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Build Unified OptScale Images
        run: |
          # Navigate to the folder containing the build script
          cd optscale-deploy/compose
          
          # Ensure script is executable and build the local images
          chmod +x build-unified.sh
          ./build-unified.sh

      - name: Retag and Push Images
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          # 1. Force the Docker username to strictly lowercase to satisfy Docker naming rules
          HUB_USER=$(echo "$DOCKER_USERNAME" | tr '[:upper:]' '[:lower:]')
          
          echo "Starting retag and push process for user: $HUB_USER"
          
          # 2. Find images starting with "hystax/", but explicitly ignore "<none>" tags
          docker images --format "{{.Repository}}:{{.Tag}}" | grep "^hystax/" | grep -v "<none>" | while read -r IMAGE; do
              
              # Extract the image name and tag
              IMAGE_NAME=$(echo "$IMAGE" | sed 's/hystax\///')
              
              echo "----------------------------------------"
              echo "Processing $IMAGE_NAME..."
              
              # Retag for your personal Docker Hub account
              docker tag "$IMAGE" "$HUB_USER/$IMAGE_NAME"
              
              # Push the image to Docker Hub
              docker push "$HUB_USER/$IMAGE_NAME"
          done
