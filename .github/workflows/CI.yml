name: Build and Push OptScale Images

on:
  push:
    branches:
      - integration  # Triggers pipeline when code is pushed to main
  workflow_dispatch: # Adds a button to trigger it manually from the GitHub UI

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches tags, which OptScale build scripts sometimes require

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Retag and Push Images
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          HUB_USER=$(echo "$DOCKER_USERNAME" | tr '[:upper:]' '[:lower:]')
          echo "Starting retag and push process for user: $HUB_USER"
          
          # 1. First, process all the custom hystax images (ignoring local/latest duplicates)
          docker images --format "{{.Repository}}:{{.Tag}}" | grep "^hystax/.*:2026042701-public" | while read -r IMAGE; do
              # Extract just the image name (remove 'hystax/')
              IMAGE_NAME=$(echo "$IMAGE" | sed 's/hystax\///')
              
              echo "Processing Hystax App: $IMAGE_NAME..."
              docker tag "$IMAGE" "$HUB_USER/$IMAGE_NAME"
              docker push "$HUB_USER/$IMAGE_NAME"
          done
          
          # 2. Next, process the required 3rd-party databases & tools needed for Kubernetes
          # Define an array of the exact third-party images you need
          THIRD_PARTY_IMAGES=(
              "clickhouse/clickhouse-server:24.12"
              "curlimages/curl:latest"
              "gcr.io/etcd-development/etcd:v3.2.13"
              "rabbitmq:4.1.4-management-alpine"
              "thanosio/thanos:v0.39.1"
              "nginx:1.27-alpine"
          )
          
          for IMAGE in "${THIRD_PARTY_IMAGES[@]}"; do
              # Ensure the image exists locally first
              if docker image inspect "$IMAGE" > /dev/null 2>&1; then
                  # For 3rd party images, we strip the original namespace (e.g., clickhouse/clickhouse-server -> clickhouse-server)
                  # or if it has no namespace (e.g. rabbitmq), we just use it as is.
                  SHORT_NAME=$(echo "$IMAGE" | awk -F'/' '{print $NF}')
                  
                  echo "Processing 3rd-Party: $SHORT_NAME..."
                  docker tag "$IMAGE" "$HUB_USER/$SHORT_NAME"
                  docker push "$HUB_USER/$SHORT_NAME"
              else
                  echo "Warning: $IMAGE not found locally, skipping."
              fi
          done
              docker push "$HUB_USER/$IMAGE_NAME"
          done
