name: Build and Push OptScale Images

on:
  push:
    branches:
      - integration  # Triggers pipeline when code is pushed to main
  workflow_dispatch: # Adds a button to trigger it manually from the GitHub UI

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches tags, which OptScale build scripts sometimes require

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Build and Tag Images Natively
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          cd optscale-deploy/compose
          chmod +x build-unified.sh
          
          # Convert username to lowercase
          HUB_USER=$(echo "$DOCKER_USERNAME" | tr '[:upper:]' '[:lower:]')
          
          # Run the script: Argument 1 is the Tag, Argument 2 is your Docker Username
          echo "Building images directly for Docker Hub account: $HUB_USER"
          ./build-unified.sh "2026042701-public" "$HUB_USER"

      - name: Push Built Images to Docker Hub
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          HUB_USER=$(echo "$DOCKER_USERNAME" | tr '[:upper:]' '[:lower:]')
          
          # We know exactly which 6 images the script just built, so we push them explicitly:
          IMAGES=(
            "etcd"
            "mariadb"
            "mongo"
            "redis"
            "influxdb"
            "optscale_app"
          )
          
          for IMG in "${IMAGES[@]}"; do
            FULL_NAME="$HUB_USER/$IMG:2026042701-public"
            echo "Pushing $FULL_NAME..."
            docker push "$FULL_NAME"
          done
