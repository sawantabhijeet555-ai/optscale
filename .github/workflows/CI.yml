name: Build and Push OptScale Microservices

on:
  push:
    branches:
      - integration
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Build ALL Microservices
        run: |
          # Navigate to the main deployment folder, not the compose folder
          cd optscale-deploy
          chmod +x build.sh
          
          echo "Building all 30+ OptScale microservices..."
          # Run the main build script (standard docker, no nerdctl required on runner)
          ./build.sh

      - name: Retag and Push Microservices
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          HUB_USER=$(echo "$DOCKER_USERNAME" | tr '[:upper:]' '[:lower:]')
          echo "Using Docker Hub Account: $HUB_USER"
          
          # Find all newly built images starting with 'hystax/'
          docker images --format '{{.Repository}}:{{.Tag}}' | grep 'hystax/' | grep -v '<none>' | while read -r IMAGE; do
              
              # Extract app name and tag (e.g., hystax/auth:local -> auth:local)
              APP_NAME=${IMAGE##*/}
              NEW_TAG="$HUB_USER/$APP_NAME"
              
              echo "----------------------------------------"
              echo "Tagging: $IMAGE -> $NEW_TAG"
              docker tag "$IMAGE" "$NEW_TAG"
              
              echo "Pushing: $NEW_TAG"
              docker push "$NEW_TAG"
          done

      - name: Pull and Push 3rd-Party Database Images
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          HUB_USER=$(echo "$DOCKER_USERNAME" | tr '[:upper:]' '[:lower:]')
          
          THIRD_PARTY_IMAGES=(
              "clickhouse/clickhouse-server:24.12"
              "curlimages/curl:latest"
              "gcr.io/etcd-development/etcd:v3.2.13"
              "rabbitmq:4.1.4-management-alpine"
              "thanosio/thanos:v0.39.1"
              "nginx:1.27-alpine"
          )
          
          for BASE_IMAGE in "${THIRD_PARTY_IMAGES[@]}"; do
              echo "----------------------------------------"
              echo "Pulling: $BASE_IMAGE"
              docker pull "$BASE_IMAGE"
              
              SHORT_NAME=$(echo "$BASE_IMAGE" | awk -F'/' '{print $NF}')
              NEW_TAG="$HUB_USER/$SHORT_NAME"
              
              echo "Tagging: $BASE_IMAGE -> $NEW_TAG"
              docker tag "$BASE_IMAGE" "$NEW_TAG"
              
              echo "Pushing: $NEW_TAG"
              docker push "$NEW_TAG"
          done
