name: Build and Push OptScale Images

on:
  push:
    branches:
      - main  # Triggers pipeline when code is pushed to main
  workflow_dispatch: # Adds a button to trigger it manually from the GitHub UI

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches tags, which OptScale build scripts sometimes require

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Build Unified OptScale Images
        run: |
          # Navigate to the folder containing the build script
          cd optscale-deploy/compose
          
          # Ensure script is executable and run it
          chmod +x build-unified.sh
          ./build-unified.sh

      - name: Retag and Push Images
        run: |
          HUB_USER="${{ secrets.DOCKER_USERNAME }}"
          
          # Find all locally built images starting with "hystax/"
          docker images --format "{{.Repository}}:{{.Tag}}" | grep "^hystax/" | while read -r IMAGE; do
              # Extract image name (e.g., hystax/optscale_app:local -> optscale_app:local)
              IMAGE_NAME=$(echo "$IMAGE" | sed 's/hystax\///')
              
              echo "Processing $IMAGE_NAME..."
              
              # Retag for your personal Docker Hub account
              docker tag "$IMAGE" "$HUB_USER/$IMAGE_NAME"
              
              # Push to Docker Hub
              docker push "$HUB_USER/$IMAGE_NAME"
          done
