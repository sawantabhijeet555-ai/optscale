name: Build and Push OptScale Images

on:
  push:
    branches:
      - integration  # Triggers pipeline when code is pushed to main
  workflow_dispatch: # Adds a button to trigger it manually from the GitHub UI

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches tags, which OptScale build scripts sometimes require

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Retag and Push All Images
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          HUB_USER=$(echo "$DOCKER_USERNAME" | tr '[:upper:]' '[:lower:]')
          
          echo "=== DEBUG: LISTING ALL BUILT IMAGES ==="
          docker images
          echo "======================================="
          
          # Match ANY image containing 'hystax', regardless of prefix
          docker images --format "{{.Repository}}:{{.Tag}}" | grep "hystax" | grep -v "<none>" | while read -r FULL_IMAGE; do
              
              # Strip everything up to and including 'hystax/' 
              # Example: docker.io/hystax/auth:latest -> auth:latest
              IMAGE_ONLY=${FULL_IMAGE#*hystax/}
              
              NEW_TAG="$HUB_USER/$IMAGE_ONLY"
              
              echo "--------------------------------"
              echo "Tagging: $FULL_IMAGE -> $NEW_TAG"
              docker tag "$FULL_IMAGE" "$NEW_TAG"
              
              echo "Pushing: $NEW_TAG..."
              docker push "$NEW_TAG"
          done
