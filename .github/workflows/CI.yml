name: Build and Push OptScale Images

on:
  push:
    branches:
      - integration  # Triggers pipeline when code is pushed to main
  workflow_dispatch: # Adds a button to trigger it manually from the GitHub UI

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches tags, which OptScale build scripts sometimes require

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Retag and Push Hystax Images
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          # Convert username to lowercase to satisfy Docker naming rules
          HUB_USER=$(echo "$DOCKER_USERNAME" | tr '[:upper:]' '[:lower:]')
          
          echo "=== Starting Push for Docker Hub User: $HUB_USER ==="
          
          # List all images, filter for 'hystax/', and process them line by line
          docker images --format '{{.Repository}}:{{.Tag}}' | grep 'hystax/' | grep -v '<none>' | while read -r IMAGE; do
              
              # Extract the app name and tag (e.g., from hystax/auth:2026042701-public -> auth:2026042701-public)
              APP_NAME=$(echo "$IMAGE" | awk -F'/' '{print $2}')
              
              # Construct the new tag for your Docker Hub account
              NEW_TAG="$HUB_USER/$APP_NAME"
              
              echo "----------------------------------------"
              echo "Tagging: $IMAGE -> $NEW_TAG"
              docker tag "$IMAGE" "$NEW_TAG"
              
              echo "Pushing: $NEW_TAG"
              docker push "$NEW_TAG"
          done
